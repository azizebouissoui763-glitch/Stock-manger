<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;padding:40px;color:white;}
#loginPage{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 80px);}
.login-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.login-logo{text-align:center;margin-bottom:30px;}
.login-logo h1{font-size:32px;font-weight:700;}
.login-logo h1 span{color:#38bdf8;}
.login-logo p{color:#94a3b8;font-size:14px;margin-top:6px;}
.login-error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:18px;display:none;text-align:center;}
.login-field{margin-bottom:18px;}
.login-field label{display:block;margin-bottom:8px;color:#cbd5e1;font-size:13px;}
.login-field input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);outline:none;background:#0f172a;color:white;font-size:15px;transition:0.3s;}
.login-field input:focus{border-color:#38bdf8;}
.btn-login{width:100%;padding:15px;border:none;border-radius:14px;cursor:pointer;font-size:15px;font-weight:600;background:linear-gradient(135deg,#38bdf8,#2563eb);color:white;margin-top:8px;transition:0.3s;}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(56,189,248,0.3);}
#appPage{display:none;}
.container{width:95%;margin:auto;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px;flex-wrap:wrap;gap:16px;}
.logo{font-size:34px;font-weight:700;}
.logo span{color:#38bdf8;}
.topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.user-badge{background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.2);color:#38bdf8;padding:8px 16px;border-radius:99px;font-size:14px;font-weight:500;}
.btn-logout{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.2);color:#f87171;padding:9px 18px;border-radius:12px;cursor:pointer;font-size:14px;transition:0.3s;}
.btn-logout:hover{background:rgba(239,68,68,0.25);}
.search-box input{padding:12px 18px;border:1px solid rgba(255,255,255,0.1);border-radius:12px;outline:none;background:rgba(255,255,255,0.08);color:white;font-size:14px;width:260px;}
.search-box input::placeholder{color:#94a3b8;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:25px;}
.stat-box{background:rgba(255,255,255,0.08);border-radius:20px;padding:20px;border:1px solid rgba(255,255,255,0.1);}
.stat-box h3{font-size:13px;color:#cbd5e1;margin-bottom:8px;}
.stat-box p{font-size:28px;font-weight:700;}
.grid{display:grid;grid-template-columns:340px 1fr;gap:25px;}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,0.25);}
.card h2{margin-bottom:20px;font-size:20px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;margin-bottom:6px;color:#cbd5e1;font-size:13px;}
.form-group input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);outline:none;background:#0f172a;color:white;font-size:14px;transition:0.3s;}
.form-group input:focus{border-color:#38bdf8;}
.btn-add{width:100%;padding:13px;border:none;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;background:linear-gradient(135deg,#38bdf8,#2563eb);color:white;margin-top:6px;transition:0.3s;}
.btn-add:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(56,189,248,0.3);}
.table-card{overflow:auto;}
table{width:100%;border-collapse:collapse;}
table th{text-align:left;padding:14px 16px;color:#94a3b8;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.1);}
table td{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;}
table tr:hover td{background:rgba(255,255,255,0.04);}
.badge{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:600;}
.normal{background:rgba(34,197,94,0.15);color:#4ade80;}
.medium{background:rgba(251,191,36,0.15);color:#facc15;}
.low{background:rgba(239,68,68,0.15);color:#f87171;}
.action-btn{border:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:white;font-size:12px;font-weight:600;transition:0.3s;margin:2px;}
.btn-use{background:#ef4444;}.btn-use:hover{background:#dc2626;}
.btn-edit{background:#3b82f6;}.btn-edit:hover{background:#2563eb;}
.btn-del{background:#6b7280;}.btn-del:hover{background:#4b5563;}
.toast{position:fixed;bottom:30px;right:30px;padding:14px 22px;border-radius:14px;font-size:14px;font-weight:500;display:none;z-index:999;box-shadow:0 8px 30px rgba(0,0,0,0.4);}
.toast-info{background:#1e293b;border:1px solid rgba(56,189,248,0.3);color:#38bdf8;}
.toast-alert{background:#2d1515;border:1px solid rgba(239,68,68,0.4);color:#f87171;}
@media(max-width:950px){.grid{grid-template-columns:1fr;}.stats{grid-template-columns:1fr;}.topbar{flex-direction:column;}}
</style>
</head>
<body>

<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <h1>📦 Stock<span>Manager</span></h1>
      <p>Connectez-vous pour accéder au stock</p>
    </div>
    <div class="login-error" id="loginError">Nom d'utilisateur ou mot de passe incorrect</div>
    <div class="login-field">
      <label>Nom d'utilisateur</label>
      <input type="text" id="inputUser" placeholder="Entrez votre nom" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-field">
      <label>Mot de passe</label>
      <input type="password" id="inputPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()">Se connecter →</button>
  </div>
</div>

<div id="appPage">
<div class="container">
  <div class="topbar">
    <div class="logo">📦 Stock<span>Manager</span></div>
    <div class="topbar-right">
      <span class="user-badge" id="userBadge">👤</span>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Chercher produit...">
      </div>
      <button class="btn-logout" onclick="doLogout()">🚪 Déconnexion</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat-box"><h3>Total Produits</h3><p id="totalProducts">0</p></div>
    <div class="stat-box"><h3>⚠️ Stock Critique</h3><p id="criticalStock" style="color:#f87171">0</p></div>
    <div class="stat-box"><h3>Total Quantité</h3><p id="totalQty">0</p></div>
  </div>
  <div class="grid">
    <div class="card">
      <h2 id="formTitle">➕ Ajouter Produit</h2>
      <input type="hidden" id="editIndex" value="-1">
      <div class="form-group"><label>Nom Produit</label><input type="text" id="fname"></div>
      <div class="form-group"><label>PIN</label><input type="text" id="fpin"></div>
      <div class="form-group"><label>Case</label><input type="text" id="fcase"></div>
      <div class="form-group"><label>Rack</label><input type="text" id="frack"></div>
      <div class="form-group"><label>Quantité</label><input type="number" id="fqty" min="0"></div>
      <div class="form-group"><label>Description</label><input type="text" id="fdesc"></div>
      <button class="btn-add" onclick="saveProduct()">💾 Enregistrer</button>
    </div>
    <div class="card table-card">
      <h2>📋 Liste des Produits</h2>
      <table>
        <thead>
          <tr><th>Produit</th><th>PIN</th><th>Case</th><th>Rack</th><th>Qté</th><th>Description</th><th>Statut</th><th>Actions</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>
</div>
<div class="toast toast-info" id="toast"></div>

<script>
const EMAILJS_PUBLIC_KEY="7Pc2GNF9CwjWZmN6P";
const EMAILJS_SERVICE_ID="service_weac324";
const EMAILJS_TEMPLATE_ID="template_obzy1r7";
emailjs.init(EMAILJS_PUBLIC_KEY);
const USERS={"admin":"admin123","Abdelaziz":"1234"};
const DEFAULT_DATA=[
  {name:"motor",   pin:"1", case:"A1",rack:"R1",qty:10, desc:"Moteur DC 12V"},
  {name:"cable",   pin:"2", case:"A2",rack:"R1",qty:50, desc:"Câble 2.5mm"},
  {name:"pedal",   pin:"3", case:"B1",rack:"R2",qty:5,  desc:"Pédale de commande"},
  {name:"resistor",pin:"4", case:"B2",rack:"R2",qty:100,desc:"Résistance 220 Ohm"},
  {name:"led",     pin:"5", case:"C1",rack:"R3",qty:80, desc:"LED Verte 5mm"},
  {name:"sensor",  pin:"6", case:"C2",rack:"R3",qty:15, desc:"Capteur IR"},
  {name:"terminal",pin:"7", case:"D1",rack:"R4",qty:25, desc:"Terminal de connexion"},
  {name:"valve",   pin:"8", case:"D2",rack:"R4",qty:8,  desc:"Électrovanne 24V"},
  {name:"attach",  pin:"9", case:"E1",rack:"R5",qty:40, desc:"Attaches plastiques"},
  {name:"config",  pin:"10",case:"E2",rack:"R5",qty:1,  desc:"Module de configuration"},
];
function loadData(){const s=localStorage.getItem("stockData");return s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_DATA));}
function saveData(d){localStorage.setItem("stockData",JSON.stringify(d));}
function sendAlertEmail(p){
  emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{
    title:"⚠️ ALERTE STOCK CRITIQUE",
    name:"Stock Manager",
    product_name:p.name.toUpperCase(),
    quantity:p.qty,
    case:p.case,
    rack:p.rack,
    message:`⚠️ ALERTE STOCK CRITIQUE!\n\nProduit: ${p.name.toUpperCase()}\nQuantité restante: ${p.qty}\nCase: ${p.case} | Rack: ${p.rack}\n\nVeuillez réapprovisionner dès que possible!`,
    email:"azizebouissoui763@gmail.com"
  }).then(()=>showToast("📧 Email d'alerte envoyé !","alert"))
    .catch(()=>showToast("❌ Erreur envoi email","alert"));
}
function doLogin(){
  const user=document.getElementById("inputUser").value.trim();
  const pass=document.getElementById("inputPass").value;
  if(USERS[user]&&USERS[user]===pass){
    document.getElementById("loginError").style.display="none";
    document.getElementById("loginPage").style.display="none";
    document.getElementById("appPage").style.display="block";
    document.getElementById("userBadge").innerText="👤 "+user;
    renderTable();
  }else{
    document.getElementById("loginError").style.display="block";
    document.getElementById("inputPass").value="";
  }
}
function doLogout(){
  document.getElementById("appPage").style.display="none";
  document.getElementById("loginPage").style.display="flex";
  document.getElementById("inputUser").value="";
  document.getElementById("inputPass").value="";
}
function getBadge(qty){
  if(qty<=5)return{cls:"low",txt:"⚠️ Critique"};
  if(qty>20)return{cls:"normal",txt:"✅ Normal"};
  return{cls:"medium",txt:"🔶 Faible"};
}
function renderTable(filter=""){
  const data=loadData();
  const tbody=document.getElementById("tableBody");
  tbody.innerHTML="";
  let totalQty=0,critical=0;
  data.forEach((p,i)=>{
    if(filter&&!p.name.toLowerCase().includes(filter))return;
    const{cls,txt}=getBadge(p.qty);
    totalQty+=p.qty;if(p.qty<=5)critical++;
    const tr=document.createElement("tr");
    tr.innerHTML=`<td><strong>${p.name}</strong></td><td>${p.pin}</td><td>${p.case}</td><td>${p.rack}</td><td><strong style="${p.qty<=5?'color:#f87171':p.qty<=20?'color:#facc15':'color:#4ade80'}">${p.qty}</strong></td><td style="color:#94a3b8">${p.desc}</td><td><span class="badge ${cls}">${txt}</span></td><td><button class="action-btn btn-use" onclick="useProduct(${i})">💡</button><button class="action-btn btn-edit" onclick="editProduct(${i})">✏️</button><button class="action-btn btn-del" onclick="deleteProduct(${i})">🗑️</button></td>`;
    tbody.appendChild(tr);
  });
  document.getElementById("totalProducts").innerText=data.length;
  document.getElementById("totalQty").innerText=totalQty;
  document.getElementById("criticalStock").innerText=critical;
}
document.getElementById("searchInput").addEventListener("keyup",()=>{
  renderTable(document.getElementById("searchInput").value.toLowerCase());
});
function saveProduct(){
  const idx=parseInt(document.getElementById("editIndex").value);
  const name=document.getElementById("fname").value.trim();
  const pin=document.getElementById("fpin").value.trim();
  const cas=document.getElementById("fcase").value.trim();
  const rack=document.getElementById("frack").value.trim();
  const qty=parseInt(document.getElementById("fqty").value);
  const desc=document.getElementById("fdesc").value.trim();
  if(!name||isNaN(qty)){showToast("⚠️ Remplir les champs obligatoires");return;}
  const data=loadData();
  if(idx>=0){data[idx]={name,pin,case:cas,rack,qty,desc};showToast("✅ Produit modifié !");}
  else{data.push({name,pin,case:cas,rack,qty,desc});showToast("✅ Produit ajouté !");}
  saveData(data);
  if(qty<=5)sendAlertEmail({name,qty,case:cas,rack});
  clearForm();renderTable();
}
function useProduct(i){
  const data=loadData();
  if(data[i].qty>0){
    data[i].qty--;saveData(data);
    showToast("💡 LED PIN "+data[i].pin+" ON — Qté: "+data[i].qty);
    if(data[i].qty<=5)sendAlertEmail(data[i]);
    renderTable();
  }else showToast("⚠️ Stock vide !","alert");
}
function editProduct(i){
  const p=loadData()[i];
  document.getElementById("editIndex").value=i;
  document.getElementById("fname").value=p.name;
  document.getElementById("fpin").value=p.pin;
  document.getElementById("fcase").value=p.case;
  document.getElementById("frack").value=p.rack;
  document.getElementById("fqty").value=p.qty;
  document.getElementById("fdesc").value=p.desc;
  document.getElementById("formTitle").innerText="✏️ Modifier Produit";
  document.getElementById("fname").focus();
}
function deleteProduct(i){
  if(!confirm("Supprimer ce produit ?"))return;
  const data=loadData();data.splice(i,1);saveData(data);
  showToast("🗑️ Supprimé");renderTable();
}
function clearForm(){
  ["fname","fpin","fcase","frack","fqty","fdesc"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("editIndex").value="-1";
  document.getElementById("formTitle").innerText="➕ Ajouter Produit";
}
function showToast(msg,type="info"){
  const t=document.getElementById("toast");
  t.className="toast "+(type==="alert"?"toast-alert":"toast-info");
  t.innerText=msg;t.style.display="block";
  setTimeout(()=>t.style.display="none",3000);
}
</script>
</body>
</html>
